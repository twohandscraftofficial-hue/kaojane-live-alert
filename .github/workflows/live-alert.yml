
name: KaoJane LIVE Alert

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send Telegram test message"
        type: boolean
        default: false
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: kaojane-live-alert
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check TikTok LIVE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
        run: python check_live.py

      - name: Save LIVE state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update LIVE state [skip ci]"
            git push
          fi
