
name: KaoJane LIVE Alert

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send Telegram test message"
        type: boolean
        default: false
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: kaojane-live-alert
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main before checking updates
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check TikTok LIVE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
        run: python check_live.py

      - name: Save LIVE state and subscribers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_state.json subscribers.enc

          if ! git diff --cached --quiet; then
            git commit -m "Save LIVE state and encrypted subscribers [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to save"
          fi
